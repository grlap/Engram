[package]
name = "engram"
version = "0.1.0"
edition = "2024"
description = "Concurrent local execution memory and task-report handoff for coding agents"
license = "Apache-2.0"
publish = false
repository = "https://github.com/grlap/Engram"

[dependencies]
anyhow = "1.0"
cap-std = "4.0"
cap-fs-ext = "4.0"
same-file = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "trace"] }
rmcp = { version = "3.1", default-features = false, features = ["macros", "server", "transport-io"] }
# Exact because the generated JSON Schema is part of snapshot format identity.
schemars = { version = "=1.2.2", features = ["chrono04", "uuid1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
unicode-casefold = "0.2"
unicode-general-category = "1.1"
unicode-normalization = "0.1"
uuid = { version = "1.18", features = ["serde", "v4", "v7"] }

[dev-dependencies]
rusqlite = { version = "0.40", default-features = false, features = ["trace"] }
tempfile = "3.20"

[target.'cfg(windows)'.dev-dependencies]
junction = "2.1"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", default-features = false, features = ["fs"] }

[profile.release]
lto = "thin"
strip = "symbols"

# Debug test time depends on two dependencies: sha2, which every process that
# reports a build hash runs over its whole executable, and the bundled SQLite
# C library. Build both optimized in the dev/test profile; Engram's own code
# keeps full debug info. docs/development.md gives the measurements.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
