[package]
name = "engram"
version = "0.1.0"
edition = "2024"
description = "Concurrent local execution memory and task-report handoff for coding agents"
publish = false
repository = "https://github.com/grlap/Engram"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
rmcp = { version = "3.1", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
unicode-casefold = "0.2"
unicode-general-category = "1.1"
unicode-normalization = "0.1"
uuid = { version = "1.18", features = ["serde", "v4", "v7"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
