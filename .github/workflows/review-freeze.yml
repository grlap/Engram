name: Launcher source verification

on:
  pull_request:
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Engram for launcher tests
        run: cargo build --bin engram
      - name: Test shared source_id and launcher completion
        run: node --test scripts/test-launcher.test.mjs
      - name: Check documentation links
        run: node scripts/check-doc-links.mjs
