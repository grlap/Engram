name: Review integrity helper

on:
  pull_request:
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test review input fingerprinting
        run: node --test scripts/review-freeze-fingerprint.test.mjs
      - name: Check documentation links
        run: node scripts/check-doc-links.mjs
